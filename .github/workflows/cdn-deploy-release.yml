# Release the cdn-deploy action. Push a full-version tag (e.g. cdn-deploy-v1.2.3)
# and this moves the floating major tag (cdn-deploy-v1) to the same commit so
# consumers can pin `decentraland/actions/cdn-deploy@cdn-deploy-v1`.
#
#   git tag cdn-deploy-v1.2.3 && git push origin cdn-deploy-v1.2.3
#
# Ensure dist/ is rebuilt and committed before tagging (see cdn-deploy/README.md).

name: cdn-deploy release

on:
  push:
    tags:
      - "cdn-deploy-v*.*.*"

permissions:
  contents: write

jobs:
  retag-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Move the major tag to this release
        env:
          FULL_TAG: ${{ github.ref_name }} # e.g. cdn-deploy-v1.2.3
        run: |
          set -euo pipefail
          major="${FULL_TAG%%.*}"          # cdn-deploy-v1
          echo "Pinning ${major} -> ${FULL_TAG} (${GITHUB_SHA})"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
