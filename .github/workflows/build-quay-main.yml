name: Build, push & deploy image

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      deployment-environment:
        required: false
        type: string
      docker-tag:
        required: false
        type: string
        default: latest
      skip-commit-sha-tag:
        required: false
        type: boolean
        default: false
        description: "Do not tag the image with the commit SHA. Set on release/versioned builds whose trigger is not a release event (e.g. a release-branch push), so the SHA tag stays on the main build's digest."
      build-args:
        required: false
        type: string
      layers:
        required: false
        type: boolean
        default: true
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_TOKEN:
        required: true
    outputs:
      registry-path:
        description: "Registry path"
        value: ${{ jobs.quay-build-push.outputs.registry-path }}
      registry-paths:
        description: "Registry paths (JSON)"
        value: ${{ jobs.quay-build-push.outputs.registry-paths }}

jobs:
  quay-build-push:
    runs-on: ubuntu-latest
    outputs:
      registry-path: ${{ steps.push-to-quay.outputs.registry-path }}
      registry-paths: ${{ steps.push-to-quay.outputs.registry-paths }}
    steps:
      - uses: actions/checkout@v4.1.4
      # An empty docker-tag makes the tags expression below fall through and re-push the SHA tag.
      - name: Require an immutable docker-tag when the SHA tag is skipped
        if: ${{ github.event_name == 'release' || inputs.skip-commit-sha-tag }}
        env:
          DOCKER_TAG: ${{ inputs.docker-tag }}
        run: |
          case "$DOCKER_TAG" in
            ""|latest|next)
              echo "::error::docker-tag must be an immutable version when the commit-SHA tag is skipped."
              exit 1 ;;
          esac
      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@v2.13
        with:
          image: ${{ inputs.service-name }}
          layers: ${{ inputs.layers }}
          # Re-tagging the SHA onto a release-built digest leaves the main build's digest untagged;
          # Quay GC reaps it and tasks pinned to it fail with CannotPullContainerError.
          tags: ${{ (github.event_name == 'release' || inputs.skip-commit-sha-tag) && inputs.docker-tag || format('{0} {1}', github.sha, inputs.docker-tag) }}
          dockerfiles: |
            ./Dockerfile
          build-args: |
            ${{ inputs.build-args }}
            COMMIT_HASH=${{ github.sha }}
      # Podman Login action (https://github.com/redhat-actions/podman-login) also be used to log in,
      # in which case 'username' and 'password' can be omitted.
      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v2.8
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: quay.io/decentraland
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-quay.outputs.registry-paths }}"

  deployment:
    if: ${{ inputs.deployment-environment }}
    needs: [quay-build-push]
    name: "Deploy to: ${{ inputs.deployment-environment }}"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        id: deploy
        uses: decentraland/dcl-deploy-action@main
        with:
          dockerImage: "${{ needs.quay-build-push.outputs.registry-path }}"
          serviceName: ${{ inputs.service-name }}
          env: ${{ inputs.deployment-environment }}
          token: ${{ secrets.GITHUB_TOKEN }}
