name: Deploy specific tag to environment

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      deployment-environment:
        required: false
        type: string
      tag:
        required: true
        default: "latest"
        type: string
        description: "Docker tag (quay.io)"

jobs:
  deployment:
    if: ${{ inputs.deployment-environment }}
    name: "Deploy to: ${{ inputs.deployment-environment }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Block mutable tags on prd
        if: ${{ inputs.deployment-environment == 'prd' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # latest@sha256:… is blocked too: a digest pin guarantees content but not persistence,
          # since Quay GC reaps the digest once the mutable tag moves off it.
          case "$TAG" in
            latest|next|latest@*|next@*)
              echo "::error::Refusing to deploy a mutable tag (latest/next) to prd. Pin an immutable version tag."
              exit 1 ;;
          esac
      - name: Trigger deployment
        id: deploy
        uses: decentraland/actions/deploy-service@main
        with:
          docker-image: "quay.io/decentraland/${{ inputs.service-name }}:${{ inputs.tag }}"
          service-name: ${{ inputs.service-name }}
          env: ${{ inputs.deployment-environment }}
          token: ${{ secrets.GITHUB_TOKEN }}
