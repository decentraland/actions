name: Manually deploy a service tag to an environment

on:
  workflow_dispatch:
    inputs:
      service-name:
        required: true
        type: string
        description: "Name of the service of the Definitions repo"
      deployment-environment:
        required: true
        type: choice
        options:
          - dev
          - prd
          - stg
          - biz
        default: dev
        description: Target environment
      tag:
        required: true
        default: "latest"
        type: string
        description: "Docker tag (quay.io)"

jobs:
  deployment:
    if: ${{ inputs.deployment-environment }}
    name: "Deploy to: ${{ inputs.deployment-environment }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-environment }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Block mutable tags on prd
        if: ${{ inputs.deployment-environment == 'prd' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # latest@sha256:… blocked too - a digest pin guarantees content, not persistence.
          case "$TAG" in
            latest|next|latest@*|next@*)
              echo "::error::Refusing to deploy a mutable tag (latest/next) to prd. Pin an immutable version tag."
              exit 1 ;;
          esac
      - name: Trigger deployment
        id: deploy
        uses: decentraland/actions/deploy-service@main
        with:
          docker-image: "quay.io/decentraland/${{ inputs.service-name }}:${{ inputs.tag }}"
          service-name: ${{ inputs.service-name }}
          env: ${{ inputs.deployment-environment }}
          token: ${{ secrets.GITHUB_TOKEN }}
