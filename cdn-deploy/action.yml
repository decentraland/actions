name: "Deploy static site to CDN"
description: "Upload a pre-built site folder straight to S3 (via GitHub OIDC) and set the Cloudflare KV rollout, in a single step."
branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  dist-path:
    description: "Path to the pre-built site directory to upload (e.g. ./dist). The caller builds it. Must be a directory inside the workspace. Required for a normal deploy; omit for a release copy (`copy-from-commit`) or a repoint."
    required: false
  source-version:
    description: "Explicit version in S3 to copy FROM. Outranks `dist-path`: set it only when you mean to copy already-uploaded bytes rather than publish the folder."
    required: false
  copy-from-commit:
    description: "Release flow: when the target `version` is not yet in S3, fill it by copying the current commit's already-uploaded build. Off by default, so a `version` that is simply absent fails instead of being silently filled with whatever this commit built."
    required: false
    default: "false"
  commit:
    description: "Commit sha to compute the version from (manual deploy by commit). Defaults to the workflow commit. Must be a hex sha, not a branch name, and the repo must be checked out at it so the base version is read from package.json."
    required: false
  package-name:
    description: "CDN prefix / S3 key root / KV record prefix. Defaults to `name` from the repo-root package.json. Validated as an npm package name."
    required: false
  base-version:
    description: "Base version the deployed version is built from. Defaults to `version` in the repo-root package.json; set it when the repo isn't checked out."
    required: false
  deployment-path:
    description: "Path-based KV key (e.g. `auth`). Defaults to the package name without its `@scope/` and trailing `-site`. Mutually exclusive with `domain`."
    required: false
  domain:
    description: "Domain-based KV key (e.g. `play.decentraland.org`). Mutually exclusive with `deployment-path`."
    required: false
  deployment-environments:
    description: 'Environments to repoint, as a JSON array or comma list (e.g. ''["zone","today"]''). Empty array ''[]'' stages the bytes in S3 without touching any KV. Defaults to zone + today. Mutually exclusive with `deployment-environment`.'
    required: false
  deployment-environment:
    description: "Single-environment shorthand for `deployment-environments` (e.g. `org`)."
    required: false
  force:
    description: "Re-upload / re-copy the bytes even when the target version is already in S3."
    required: false
    default: "false"
  deployment-name:
    description: "Rollout name (key into the KV `records` map)."
    required: false
    default: "_site"
  percentage:
    description: "Rollout percentage (0-100) for the deployed version."
    required: false
    default: "100"
  require-index:
    description: "Fail a deploy when the folder has no index.html at its root (guards against an empty/broken build). Set to 'false' to deploy non-HTML asset bundles."
    required: false
    default: "true"
  version:
    description: "Target version. Defaults to the computed commit version. Provide it to deploy under a specific version (e.g. a release tag), or alone to repoint the KV at an already-uploaded version. A target that is absent from S3 is an error unless `dist-path`, `source-version` or `copy-from-commit` says how to fill it."
    required: false
  aws-region:
    description: "AWS region for STS / S3."
    required: false
    default: "us-east-1"
  aws-role-to-assume:
    description: "IAM role ARN assumed via GitHub OIDC (no static AWS keys). Required: every flow reads S3 to check whether the target version is already deployed. The role needs s3:ListBucket on the bucket plus s3:GetObject/s3:PutObject/s3:PutObjectAcl on the package prefix (objects are written public-read, and S3 requires PutObjectAcl for any request carrying an ACL)."
    required: true
  s3-bucket:
    description: "Target CDN S3 bucket. Must have ACLs enabled (Object Ownership other than BucketOwnerEnforced) — objects are written `public-read`."
    required: false
    default: "cdn-decentraland-org-contentbucket-371d0b7"
  cloudflare-account-id:
    description: "Cloudflare account id for the KV REST API. Required unless `deployment-environments` is '[]' (stage only)."
    required: false
  cloudflare-api-token:
    description: "Cloudflare API token scoped to Workers KV Storage: Edit on the rollout namespaces. Required unless `deployment-environments` is '[]' (stage only). The single secret this action needs."
    required: false
  cloudflare-namespace-id:
    description: "Explicit Cloudflare KV namespace id. Overrides the per-environment mapping below. Rejected for a multi-environment run, which would otherwise write every environment to the same namespace."
    required: false
  cloudflare-namespace-zone:
    description: "Cloudflare KV namespace id for `zone` (dev). Supplied via the org secret CF_NS_ZONE."
    required: false
  cloudflare-namespace-today:
    description: "Cloudflare KV namespace id for `today` (stg). Supplied via the org secret CF_NS_TODAY."
    required: false
  cloudflare-namespace-org:
    description: "Cloudflare KV namespace id for `org` (prod). Supplied via the org secret CF_NS_ORG."
    required: false
  slack-webhook:
    description: "Incoming Slack webhook URL. Posts to the channel the webhook was installed on. Skipped if unset."
    required: false
  create-github-deployment:
    description: "Create a GitHub deployment + commit status for observability. Needs `permissions: { deployments: write, statuses: write }`."
    required: false
    default: "true"
  cdn-base-url:
    description: "CDN origin used to compute the cdn-url output."
    required: false
    default: "https://cdn.decentraland.org"

outputs:
  version:
    description: "The deployed version (computed snapshot, or the `version` input)."
    value: ${{ steps.deploy.outputs.version }}
  s3-path:
    description: "The S3 key prefix that was uploaded: <package-name>/<version>."
    value: ${{ steps.deploy.outputs.s3-path }}
  cdn-url:
    description: "<cdn-base-url>/<package-name>/<version> — where the worker serves the version from."
    value: ${{ steps.deploy.outputs.cdn-url }}
  mode:
    description: "What the S3 step did: upload | copy | skip. Set before the KV write, so it is readable from an `if: always()` step even when the run later fails."
    value: ${{ steps.deploy.outputs.mode }}

runs:
  using: "composite"
  steps:
    # `required: true` is documentation-only for a composite action, so check it
    # here and fail with something actionable instead of an opaque STS error.
    - name: Check the OIDC role is set
      shell: bash
      env:
        AWS_ROLE_TO_ASSUME: ${{ inputs.aws-role-to-assume }}
      run: |
        set -euo pipefail
        if [ -z "${AWS_ROLE_TO_ASSUME}" ]; then
          echo '::error::aws-role-to-assume is required. Every flow reads S3 to check whether the target version is already deployed, so the action always needs the OIDC role.' >&2
          exit 1
        fi

    # Needed on every path: even a repoint reads S3 first, to refuse pointing the
    # KV at a prefix that isn't there.
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: cdn-deploy-${{ github.repository_id }}-${{ github.run_id }}

    - name: Deploy to CDN and set rollout
      id: deploy
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
      env:
        INPUT_DIST-PATH: ${{ inputs.dist-path }}
        INPUT_SOURCE-VERSION: ${{ inputs.source-version }}
        INPUT_COPY-FROM-COMMIT: ${{ inputs.copy-from-commit }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_PACKAGE-NAME: ${{ inputs.package-name }}
        INPUT_BASE-VERSION: ${{ inputs.base-version }}
        INPUT_DEPLOYMENT-PATH: ${{ inputs.deployment-path }}
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_DEPLOYMENT-ENVIRONMENTS: ${{ inputs.deployment-environments }}
        INPUT_DEPLOYMENT-ENVIRONMENT: ${{ inputs.deployment-environment }}
        INPUT_DEPLOYMENT-NAME: ${{ inputs.deployment-name }}
        INPUT_PERCENTAGE: ${{ inputs.percentage }}
        INPUT_REQUIRE-INDEX: ${{ inputs.require-index }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_AWS-REGION: ${{ inputs.aws-region }}
        INPUT_S3-BUCKET: ${{ inputs.s3-bucket }}
        INPUT_CLOUDFLARE-ACCOUNT-ID: ${{ inputs.cloudflare-account-id }}
        INPUT_CLOUDFLARE-API-TOKEN: ${{ inputs.cloudflare-api-token }}
        INPUT_CLOUDFLARE-NAMESPACE-ID: ${{ inputs.cloudflare-namespace-id }}
        INPUT_CLOUDFLARE-NAMESPACE-ZONE: ${{ inputs.cloudflare-namespace-zone }}
        INPUT_CLOUDFLARE-NAMESPACE-TODAY: ${{ inputs.cloudflare-namespace-today }}
        INPUT_CLOUDFLARE-NAMESPACE-ORG: ${{ inputs.cloudflare-namespace-org }}
        INPUT_SLACK-WEBHOOK: ${{ inputs.slack-webhook }}
        INPUT_CREATE-GITHUB-DEPLOYMENT: ${{ inputs.create-github-deployment }}
        INPUT_CDN-BASE-URL: ${{ inputs.cdn-base-url }}
        GITHUB_TOKEN: ${{ github.token }}
